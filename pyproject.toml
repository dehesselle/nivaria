[project]
name = "nivaria"
dynamic = ["version"]
description = "A TUI for quickly browsing and searching Snowflake objects"
readme = "README.md"
license = "0BSD"
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.11.0",
    "snowflake-connector-python[secure-local-storage]>=4.7.3",
    "tcoda>=0.8.0,<0.9",
    "textual>=8.2.8,<9",
]

[project.scripts]
nivaria = "nivaria:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.vcs]
version-file = "src/nivaria/version.py"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The UI tests are all async; auto mode saves marking every one of them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "textual-dev>=1.8.0",
    "wonderwords>=3.0.1",
]

[tool.ruff]
# Ruff comes from outside the project, and its defaults change between minor
# releases; bump this once a new minor's findings have been reviewed, together
# with the pin in .github/workflows/build.yml.
required-version = "~=0.16.0"
