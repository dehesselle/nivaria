[project]
name = "snowcone"
dynamic = ["version"]
description = "A TUI for quickly browsing and searching Snowflake objects"
readme = "README.md"
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.11.0",
    "snowflake-connector-python[secure-local-storage]>=4.7.3",
    "textual>=8.2.8",
]

[tool.uv.sources]
# Not a real dependency: tcoda's sources are bundled into our own wheel by
# hatch_build.py rather than installed from anywhere, so it must not appear in
# [project.dependencies] (it isn't on PyPI, so any plain `pip install` would
# fail to resolve it, or pick up whatever else might claim the name). Listed
# here only so `uv sync`'s dev dependency group below can install it editable.
tcoda = { path = "../tcoda", editable = true }

[project.scripts]
snowcone = "snowcone:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.vcs]
version-file = "src/snowcone/version.py"

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The UI tests are all async; auto mode saves marking every one of them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "tcoda",
    "textual-dev>=1.8.0",
    "wonderwords>=3.0.1",
]
